# Checks the lab's Terraform on every change: formatting, and that it
# validates against the pinned providers. No AWS credentials are needed.
name: Validate Terraform

on:
  pull_request:
    paths:
      - "terraform-scripts/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: ["main"]
    paths:
      - "terraform-scripts/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -diff
      - name: Init (no backend)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate -no-color
